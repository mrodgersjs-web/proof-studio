<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#C8A96E;letter-spacing:3px;text-transform:uppercase}
      .title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;fill:#F5F0EB}
      .label{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:12px;fill:#F5F0EB;letter-spacing:1px}
      .mono{font-family:'JetBrains Mono','SF Mono',monospace;font-size:11px;fill:#A09890}
      .mono-gold{font-family:'JetBrains Mono','SF Mono',monospace;font-size:11px;fill:#C8A96E}
      .caption{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#635D57;letter-spacing:2px;text-transform:uppercase}
    </style>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0"/>
      <stop offset="15%" stop-color="#C8A96E" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#C8A96E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A1512" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8A96E"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#ambient)"/>

  <text x="60" y="48" class="kicker">PROOF STUDIO</text>
  <text x="60" y="78" class="title">From artifact to verified proof</text>
  <line x1="60" y1="94" x2="220" y2="94" stroke="#C8A96E" stroke-width="1" opacity="0.5"/>

  <!-- ambient glow behind pipeline -->
  <ellipse cx="600" cy="220" rx="560" ry="90" fill="url(#glow)" opacity="0.14"/>

  <!-- connective spine -->
  <path d="M172,220 C260,190 300,190 370,220" fill="none" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M402,220 C470,250 500,250 570,220" fill="none" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M632,220 C700,190 730,190 800,220" fill="none" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M862,220 C930,250 960,250 1028,220" fill="none" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1: Artifact -->
  <g transform="translate(140,220)">
    <circle r="46" fill="url(#glow)" opacity="0.55"/>
    <circle r="32" fill="#141210" stroke="#C8A96E" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M-9,-9 H3 L9,-3 V9 H-9 Z" fill="none" stroke="#F5F0EB" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M3,-9 V-3 H9" fill="none" stroke="#F5F0EB" stroke-width="1.4" stroke-linejoin="round"/>
    <text y="-58" text-anchor="middle" class="label">ARTIFACT</text>
    <text y="66" text-anchor="middle" class="mono">build.tar.gz</text>
  </g>

  <!-- Node 2: SHA-256 -->
  <g transform="translate(370,220)">
    <circle r="46" fill="url(#glow)" opacity="0.55"/>
    <circle r="32" fill="#141210" stroke="#C8A96E" stroke-width="2" filter="url(#softGlow)"/>
    <text y="6" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="18" fill="#F5F0EB">#</text>
    <text y="-58" text-anchor="middle" class="label">SHA-256</text>
    <text y="66" text-anchor="middle" class="mono">a3f2e19c...</text>
  </g>

  <!-- Node 3: HMAC Sign -->
  <g transform="translate(600,220)">
    <circle r="46" fill="url(#glow)" opacity="0.55"/>
    <circle r="32" fill="#141210" stroke="#C8A96E" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="-7" y="-2" width="14" height="11" rx="2" fill="none" stroke="#F5F0EB" stroke-width="1.4"/>
    <path d="M-4,-2 V-6 A4,4 0 0 1 4,-6 V-2" fill="none" stroke="#F5F0EB" stroke-width="1.4"/>
    <text y="-58" text-anchor="middle" class="label">HMAC SIGN</text>
    <text y="66" text-anchor="middle" class="mono">sig:9c81f4e2</text>
  </g>

  <!-- Node 4: ProofPacket -->
  <g transform="translate(830,220)">
    <circle r="46" fill="url(#glow)" opacity="0.55"/>
    <circle r="32" fill="#141210" stroke="#C8A96E" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M-9,-10 H4 L10,-4 V10 H-9 Z" fill="none" stroke="#F5F0EB" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M4,-10 V-4 H10" fill="none" stroke="#F5F0EB" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="-5" y1="0" x2="6" y2="0" stroke="#F5F0EB" stroke-width="1.1"/>
    <line x1="-5" y1="4" x2="6" y2="4" stroke="#F5F0EB" stroke-width="1.1"/>
    <text y="-58" text-anchor="middle" class="label">PROOFPACKET</text>
    <text y="66" text-anchor="middle" class="mono">packet.json</text>
  </g>

  <!-- Node 5: Verify -->
  <g transform="translate(1060,220)">
    <circle r="52" fill="url(#glow)" opacity="0.8"/>
    <circle r="34" fill="#141210" stroke="#C8A96E" stroke-width="2.5" filter="url(#softGlow)"/>
    <path d="M-10,0 L-2,9 L11,-9" fill="none" stroke="#C8A96E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="-64" text-anchor="middle" class="label">VERIFY</text>
    <text y="70" text-anchor="middle" class="mono-gold">✓ VALID</text>
  </g>

  <line x1="60" y1="350" x2="1140" y2="350" stroke="#A09890" stroke-width="1" opacity="0.15"/>
  <text x="60" y="374" class="caption">deterministic · reproducible · offline verifiable</text>
</svg>
