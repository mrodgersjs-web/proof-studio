<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="proof-studio — artifact, hash, HMAC, verify">
  <defs>
    <linearGradient id="bg-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="50%" stop-color="#11100C"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </linearGradient>
    <linearGradient id="gold-ps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A96E"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg-ps)"/>

  <!-- Title -->
  <text x="80" y="72" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400">proof-studio</text>
  <text x="80" y="100" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5">PROOF-PACKET PIPELINE</text>

  <!-- Flow diagram centered -->
  <g transform="translate(120, 160)">
    <!-- Artifact -->
    <rect x="0" y="0" width="140" height="90" rx="6" fill="#1A1712" stroke="#C8A96E" stroke-width="2"/>
    <rect x="16" y="18" width="108" height="10" rx="2" fill="#C8A96E" opacity="0.25"/>
    <rect x="16" y="36" width="80" height="6" rx="2" fill="#C8A96E" opacity="0.15"/>
    <rect x="16" y="50" width="96" height="6" rx="2" fill="#C8A96E" opacity="0.15"/>
    <rect x="16" y="64" width="64" height="6" rx="2" fill="#C8A96E" opacity="0.15"/>
    <text x="70" y="112" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="12" font-weight="600">ARTIFACT</text>

    <!-- Arrow -->
    <line x1="155" y1="45" x2="205" y2="45" stroke="#C8A96E" stroke-width="2" opacity="0.7"/>
    <polygon points="205,45 197,41 197,49" fill="#C8A96E" opacity="0.7"/>

    <!-- Hash -->
    <rect x="220" y="0" width="200" height="90" rx="6" fill="#1A1712" stroke="#C8A96E" stroke-width="2"/>
    <text x="320" y="34" text-anchor="middle" fill="#E8D5A8" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13" font-weight="600">SHA-256 HASH</text>
    <text x="320" y="58" text-anchor="middle" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">a3f7c9…e21d84</text>
    <text x="320" y="112" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="12" font-weight="600">HASH</text>

    <!-- Arrow -->
    <line x1="435" y1="45" x2="485" y2="45" stroke="#C8A96E" stroke-width="2" opacity="0.7"/>
    <polygon points="485,45 477,41 477,49" fill="#C8A96E" opacity="0.7"/>

    <!-- HMAC -->
    <rect x="500" y="0" width="160" height="90" rx="6" fill="#1A1712" stroke="#C8A96E" stroke-width="2"/>
    <circle cx="580" cy="40" r="18" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <rect x="572" y="32" width="16" height="16" rx="2" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <text x="580" y="112" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="12" font-weight="600">HMAC</text>

    <!-- Arrow -->
    <line x1="675" y1="45" x2="725" y2="45" stroke="#C8A96E" stroke-width="2" opacity="0.7"/>
    <polygon points="725,45 717,41 717,49" fill="#C8A96E" opacity="0.7"/>

    <!-- Verify split -->
    <g transform="translate(740, 0)">
      <!-- PASS -->
      <rect x="0" y="0" width="190" height="90" rx="6" fill="#0F2618" stroke="#3D9A5E" stroke-width="2"/>
      <path d="M40 48 L55 63 L85 33" fill="none" stroke="#3D9A5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="42" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="16" font-weight="700">PASS</text>
      <text x="130" y="62" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" opacity="0.8">signature valid</text>

      <!-- FAIL -->
      <rect x="210" y="0" width="190" height="90" rx="6" fill="#2A0F0F" stroke="#C94A4A" stroke-width="2"/>
      <line x1="240" y1="33" x2="270" y2="63" stroke="#E86666" stroke-width="4" stroke-linecap="round"/>
      <line x1="270" y1="33" x2="240" y2="63" stroke="#E86666" stroke-width="4" stroke-linecap="round"/>
      <text x="340" y="42" fill="#E86666" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="16" font-weight="700">FAIL</text>
      <text x="340" y="62" fill="#E86666" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" opacity="0.8">tamper detected</text>
    </g>
  </g>

  <!-- Bottom rule -->
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#C8A96E" stroke-width="1" opacity="0.2"/>
</svg>