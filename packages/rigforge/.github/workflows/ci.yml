name: CI

# RIGForge's central promise is that a stranger can clone this repo and re-run
# the proof with no network and no credentials. CI exists to keep that true.
#
# Notes for reviewers:
#   * No secrets are used. Nothing here reads `secrets.*`, so this workflow runs
#     identically on a fork PR as on main.
#   * No external services. The only network access is `pip install` from PyPI;
#     the test suite itself opens no sockets (the cockpit tests drive FastAPI
#     in-process via TestClient).
#   * Actions are pinned to full commit SHAs, with the human-readable tag in a
#     trailing comment. Tags are mutable and can be re-pointed at new code; a
#     SHA cannot. Dependabot (.github/dependabot.yml) bumps these weekly, so the
#     pins stay current without being trusted blindly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The `dev` extra deliberately includes fastapi + httpx so this is the
      # full 252-test suite, not the 221 that run when the cockpit tests
      # importorskip themselves.
      - name: Run test suite
        run: pytest -q

  narrow-terminal:
    # Regression guard for the rich-render width bug: rigforge's `diff` command
    # renders a rich table, and rich wraps/truncates cells to the terminal
    # width. test_diff.py used to assert on cell contents at whatever COLUMNS
    # the developer's terminal happened to have, so the suite passed on a wide
    # terminal and failed on a narrow one. The test now pins its own render
    # width; this job proves that pin holds by running the whole suite at a
    # width that used to break it. Runs once -- the bug is width-dependent, not
    # Python-version-dependent.
    name: tests @ COLUMNS=54
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite at a narrow terminal width
        env:
          COLUMNS: "54"
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Blocking. Rule set is declared in [tool.ruff.lint] in pyproject.toml.
      - name: Lint (enforced rules)
        run: ruff check rigforge/ contracts/

      # Non-blocking, and honest about it: this reports the full default rule
      # set, which the codebase does NOT pass yet (~160 stylistic findings).
      # `continue-on-error` surfaces that as a visible non-green step rather
      # than hiding it behind `|| true`, which would report a lie as success.
      - name: Lint (full default rule set — advisory, not enforced)
        continue-on-error: true
        run: ruff check --isolated --statistics rigforge/ contracts/

  # NOTE: there is deliberately no type-check job. This repo has no typing
  # configuration -- no mypy/pyright config, no py.typed marker, and no
  # annotation-coverage baseline. Adding a type checker now would either fail
  # on day one or be neutered into meaninglessness. Introducing one is real
  # work (a baseline, then a ratchet), not a CI line, so it is left undone
  # rather than faked.

  build:
    name: build + install wheel
    runs-on: ubuntu-latest
    needs: [test, narrow-terminal, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Installs the built wheel into a clean venv -- catches packaging bugs
      # (missing package data, bad entry point) that an editable install hides.
      - name: Install the wheel and run the CLI
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/rigforge --version
          /tmp/wheeltest/bin/rigforge --help > /dev/null
