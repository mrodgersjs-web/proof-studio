[project]
name = "rigforge"
version = "1.0.0"
description = "Deterministic 7-phase agentic engineering platform — CLI, MCP servers, GEV contract models"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RIG", email = "ops@rig.dev"}]
readme = "README.md"
keywords = ["rig", "forge", "agentic", "deterministic", "gev", "done-contract", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "click>=8.1,<9.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rigforge"
Issues = "https://github.com/mrodgersjs-web/rigforge/issues"
CI = "https://github.com/mrodgersjs-web/rigforge/actions"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]
# README documents `pip install -e ".[telemetry]"`; these are the packages
# rigforge/telemetry.py actually imports. The module probes for them once and
# degrades to a no-op when absent, so this stays optional -- but the documented
# install path has to resolve, or the docs are lying.
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
    # Required to run the FULL suite. rigforge/tests/test_webapp.py,
    # test_followups.py and test_hardening.py drive the cockpit API through
    # fastapi.TestClient, which is backed by httpx. Without these, 9 tests
    # importorskip themselves and `pytest` reports 221 passed / 9 skipped
    # instead of 252 passed -- a green run that silently covers less.
    # These are test-time only; they do not add a runtime dependency and the
    # tests stay fully in-process (no socket is ever opened).
    "fastapi>=0.110,<1.0",
    "httpx>=0.27",
]

[project.scripts]
rigforge = "rigforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rigforge", "contracts"]
# Non-.py assets under rigforge/ (web SPA) are already collected via the
# package path above. Do NOT also force-include rigforge/web — hatchling
# then adds the same files twice and the wheel build fails with:
#   ValueError: A second file is being added ... rigforge/web/app.js

[tool.pytest.ini_options]
testpaths = ["rigforge/tests", "contracts/v1/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# What CI *enforces* (blocking). These are the correctness-class rules the
# codebase holds clean today: the pycodestyle errors that flag real problems
# (E4 imports, E7 statements, E9 syntax/IO errors) plus the pyflakes checks
# that catch genuine bugs rather than style.
#
# Deliberately NOT enforced yet: import sorting (I001), unused imports (F401),
# and the pyupgrade / flake8-* modernisation families. Against ruff's full
# default set this codebase currently reports ~160 findings, essentially all
# stylistic. That is a real backlog, not a hidden failure -- CI runs the full
# set in a clearly-labelled advisory step so the number stays visible instead
# of being masked. Adopting those rules means touching most files in the repo
# and is a separate, reviewable change on its own.
select = ["E4", "E7", "E9", "F821", "F811", "F632", "F702"]
