[project]
name = "proof-studio"
version = "1.0.0"
description = "Tamper-scenario and benchmark studio around the rigforge proof library."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mike Rodgers"}]
readme = "README.md"
keywords = ["tamper-evidence", "proof-packets", "benchmark", "ai-agents", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# pydantic is the model layer of the vendored rigforge core (packages/rigforge).
dependencies = [
    "click>=8.1,<9.0",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
]
# Only for mcp/server.py (the results MCP surface); the studio itself needs none.
mcp = [
    "mcp>=1.0,<3.0",
]

[project.scripts]
proof-studio = "proof_studio.cli:main"

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/proof-studio"
Repository = "https://github.com/mrodgersjs-web/proof-studio"
Issues = "https://github.com/mrodgersjs-web/proof-studio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proof_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import proof_studio; "packages/rigforge" makes the vendored
# core importable without an install (the studio runs from a repo clone).
pythonpath = [".", "packages/rigforge"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821", "F811", "F632", "F702"]
