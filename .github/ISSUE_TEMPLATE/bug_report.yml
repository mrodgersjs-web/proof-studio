name: Bug report
description: Report something that does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reports with the exact command and its output get fixed fastest. If a
        planted failure stopped going red, paste the `proof-studio run` table.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      placeholder: |
        proof-studio run
        <paste output>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "proof-studio 1.0.0 (pip show proof-studio)"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12 on macOS 15"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
