name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages/rigforge declares requires-python = ">=3.11"; 3.11 is the floor.
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: packages/rigforge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install rigforge with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff (repo config in pyproject.toml)
        run: ruff check .
      - name: Pytest
        run: pytest -q
