name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    name: studio tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # proof-studio requires-python = ">=3.11" (the vendored core's floor).
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install studio with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (repo config in pyproject.toml)
        run: ruff check .
      - name: Pytest with coverage
        run: pytest -q --cov
      - name: Planted-failure vectors must all go red
        run: proof-studio run

  core:
    name: vendored rigforge tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages/rigforge declares requires-python = ">=3.11"; 3.11 is the floor.
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/rigforge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/rigforge/pyproject.toml
      - name: Install rigforge with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff (repo config in pyproject.toml)
        run: ruff check .
      - name: Pytest
        run: pytest -q
